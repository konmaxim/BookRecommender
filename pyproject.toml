[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookrecommender"
version = "0.1.0"
description = "Russian-language book recommendation system — livelib.ru scraping and NLP pipeline"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "sentence-transformers>=2.6",
    "transformers>=4.38",
    "bertopic>=0.16",
    "scikit-learn>=1.3",
    "anthropic>=0.25",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "pymorphy2>=0.9",
]

[project.scripts]
bookrec        = "bookrec.cli:main"
bookrec-server = "bookrec.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookrec*"]
